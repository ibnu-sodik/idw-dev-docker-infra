version: "3.8"

services:
  db:
    image: postgres:16
    container_name: odoo-db
    environment:
      - POSTGRES_DB=postgres
      - POSTGRES_USER=odoo
      - POSTGRES_PASSWORD=odoo
    volumes:
      - ../databases/pg_data:/var/lib/postgresql/data
    restart: unless-stopped

  odoo:
    image: odoo/odoo:18.0-community
    container_name: odoo-app
    depends_on:
      - db
    ports:
      - "8069:8069"
    environment:
      - HOST=db
      - USER=odoo
      - PASSWORD=odoo
      - ADMIN_PASSWORD=admin
    volumes:
      - ./config/odoo.conf:/etc/odoo/odoo.conf
      - ./addons:/mnt/extra-addons
      - ../databases/odoo_data:/var/lib/odoo
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -f http://localhost:8069/web/database/selector || exit 1",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
